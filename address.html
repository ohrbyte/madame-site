<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — Clean in a click</title>
  <link rel="icon" href="assets/favicon-32.png?v=75" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-16.png?v=75" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=75">
  <link rel="stylesheet" href="dist/styles.css?v=75">
  <link rel="stylesheet" href="css/pages/step-2.css?v=75">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <!-- Neulis (typographer.io): real Neulis Sans (bold copy) + Neulis Cursive
       (the drawn script letters). AFTER the stylesheets on purpose so its
       @font-face wins over the local placeholders; the family names match what
       --font-sans / --font-script already reference, so nothing else changes.
       Poppins still covers the moment before load / if typographer is blocked.
       The beacon is the vendor's usage ping (part of their embed). -->
  <link rel="preconnect" href="https://typographer.io/">
  <link rel="stylesheet" href="https://typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44">
  <script type="module">try{navigator.sendBeacon("https://use.typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44")}catch{}</script>
  <script>document.documentElement.classList.add("js")</script>
</head>

<body data-page="step-2">
  <main class="stage">
    <img class="swirl swirl-back" src="assets/swirl.webp?v=75" alt="" aria-hidden="true">
    <img class="layer layer-hand" src="assets/step2-hand.webp" alt="Gloved hand holding a stack of dirty pans">
    <img class="swirl swirl-front" src="assets/swirl.webp?v=75" alt="" aria-hidden="true">
  </main>

  <!-- Corner bleed (wide frames): a self-clipped window continues the art
       past the frame's bottom-right — see index.html for the full note. -->
  <div class="corner-bleed" aria-hidden="true">
    <img class="cb-swirl" src="assets/swirl.webp?v=75" alt="">
  </div>

  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="./" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
  </header>

  <!-- Laid out to Design/step 2.png (the flat mockup — NOT Design/png/step 2.png,
       which is artwork only). Positions measured off it; see css/pages/step-2.css. -->
  <div class="content">
    <!-- The ring is TRACED from the design, not drawn by eye: scripts/_ringfit.mjs
         reads Design/step 2.png, casts rays to find the stroke's centreline and
         fits it, then scripts/_ringdiff.mjs rasterises the result and compares it
         to the design's own pink pixels (86% IoU, worst error 1.5px on a 283px
         ring). Re-run those two if it ever needs re-fitting.

         It is a SUPERELLIPSE (n~2.7), not an ellipse: the design's top and bottom
         are dead flat across the middle third and its sides are near-vertical —
         that rounded-rectangle read is the whole character of the mark, and an
         ellipse loses it. It is also tilted 1deg nose-down to the right, and
         closed, with no overshoot or crossing tail.

         viewBox is 1:1 with the design's px, and is the ring's OUTER ink box, so
         CSS's width:132% maps straight onto the ring's width.
         NO preserveAspectRatio="none" here — see .mark.circle>svg in input.css. -->
    <h1 class="headline anim" style="--d:.1s"><span class="mark circle"><span class="script">C</span>lean<svg
          viewBox="0 0 283.4 113.4">
          <path class="accent" style="--len:670"
            d="M280 59 C280 66.5 278.5 75.2 274.7 81.3 C270.9 87.5 263.6 92.3 257 96.1 C250.3 99.8 242.2 101.9 234.7 103.8 C227.1 105.7 219.3 106.8 211.6 107.7 C203.8 108.7 196 109.1 188.2 109.5 C180.4 109.9 172.6 110 164.8 110 C157 110 149.1 109.9 141.3 109.7 C133.5 109.6 125.7 109.5 117.9 109.2 C110.1 108.9 102.2 108.5 94.5 107.9 C86.7 107.3 78.9 106.5 71.2 105.4 C63.5 104.2 55.8 102.9 48.3 100.8 C40.8 98.6 32.9 96.4 26.3 92.6 C19.7 88.7 12.4 84 8.6 77.7 C4.8 71.5 3.4 62.6 3.4 55.1 C3.4 47.7 4.9 39 8.8 32.8 C12.7 26.6 20 21.8 26.7 18.1 C33.3 14.3 41.3 12.2 48.8 10.2 C56.3 8.2 64.1 7.1 71.8 6 C79.6 5 87.4 4.5 95.2 4 C103 3.6 110.8 3.5 118.6 3.4 C126.5 3.3 134.3 3.5 142.1 3.6 C149.9 3.8 157.7 3.9 165.5 4.2 C173.3 4.5 181 4.9 188.8 5.6 C196.6 6.3 204.5 7.1 212.2 8.4 C219.9 9.7 227.6 11 235 13.2 C242.5 15.4 250.2 17.7 256.9 21.6 C263.5 25.5 270.8 30.2 274.6 36.4 C278.5 42.7 280 51.5 280 59 Z" />
        </svg></span> in a click.</h1>

    <!-- Styled, not wired: real control, no submit handler yet. The design gives
         the field no visible label and no placeholder — the line above says what
         to type — so the label is there for screen readers only. -->
    <form class="panel anim" style="--d:.28s" action="#" onsubmit="return false">
      <h2>Confirm your address.</h2>
      <p>We need to verify your address is in our service area</p>

      <!-- Wired (booking.js): every address on the account, pick-one; the last
           cell reveals the manual field below. Hidden until the API answers. -->
      <div class="addrlist" role="group" aria-label="Your saved addresses" hidden></div>

      <div class="addr">
        <!-- Structured entry (street / apt / city / state / ZIP). The hidden
             #addr below carries the composed one-line form every existing
             consumer keys on — the map preview (data-map-src) and the
             saved-picker sync — so the wiring contract is unchanged. -->
        <div class="addr-form">
          <div class="field">
            <label for="addr-street">Street address</label>
            <input id="addr-street" name="addr-street" type="text" autocomplete="address-line1"
              placeholder="14 Smith St">
          </div>
          <div class="addr-row">
            <div class="field">
              <label for="addr-apt">Apt / unit</label>
              <input id="addr-apt" name="addr-apt" type="text" autocomplete="address-line2" placeholder="Optional">
            </div>
            <div class="field">
              <label for="addr-city">City</label>
              <input id="addr-city" name="addr-city" type="text" autocomplete="address-level2" placeholder="Monroe">
            </div>
          </div>
          <div class="addr-row addr-row--statezip">
            <div class="field">
              <label for="addr-state">State</label>
              <input id="addr-state" name="addr-state" type="text" autocomplete="address-level1" maxlength="2"
                value="NY">
            </div>
            <div class="field">
              <label for="addr-zip">ZIP</label>
              <input id="addr-zip" name="addr-zip" type="text" inputmode="numeric" autocomplete="postal-code"
                maxlength="5" placeholder="10950">
            </div>
          </div>
          <input type="hidden" id="addr" name="addr">
        </div>
        <!-- Live map, per the design's "Google maps" box. app.js swaps the
             center= as you type (data-map-src names the field that drives it).

             STATIC Maps, not the Embed API, on purpose: the Embed API is an
             iframe and ships Google's own chrome inside it — an "Open in Maps"
             button and zoom controls that cannot be removed or styled. Static
             Maps returns a plain PNG, which is what the design draws. The Google
             logo and "Map data" baked into the image are required attribution
             and must stay.

             A Maps key IS a client key — it goes out in every page that shows a
             map and cannot be hidden in a static site. What protects it is
             RESTRICTION, not secrecy: it is locked to an HTTP-referrer allowlist
             (localhost:3001 + the deploy domains). Restriction stops the key
             working on OTHER sites; it can't stop a script sending a spoofed
             Referer, so the hard cap is the API restriction plus a billing
             quota.

             The literal key still stays out of the REPO: the src ships the
             __GOOGLE_MAPS_API_KEY__ placeholder, which the Pages workflow
             substitutes from the GOOGLE_MAPS_API_KEY repo secret at build time.
             Local mounts serve the raw tree, so there app.js patches the
             placeholder from window.MAPS_KEY, set by the gitignored
             maps-key.js below (CI generates that file too, so the tag never
             404s in production). Consequence: on local mounts the map needs JS;
             the published site keeps the key baked into the HTML as before. -->
        <img class="addr-map" alt="Map of the address entered above" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade" data-map-src="#addr" data-map-param="center" data-map-zoom="18"
          src="https://maps.googleapis.com/maps/api/staticmap?center=Monroe,NY+10950&zoom=13&size=640x460&scale=2&key=__GOOGLE_MAPS_API_KEY__">
      </div>

      <p class="formnote" hidden></p>
    </form>

    <!-- Outside the panel, per the design: the card is the task, the button is
         the way on from it. -->
    <a class="btn anim" style="--d:.4s" href="day">Book Now</a>
  </div>

  <script src="maps-key.js?v=75"></script>
  <script src="api.js?v=75"></script>
  <script src="app.js?v=75"></script>
  <script src="booking.js?v=75"></script>
</body>

</html>
