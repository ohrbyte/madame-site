<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — All set</title>
  <link rel="icon" href="assets/favicon-32.png?v=80" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-16.png?v=80" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=80">
  <link rel="stylesheet" href="dist/styles.css?v=80">
  <link rel="stylesheet" href="css/pages/step-6.css?v=80">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <!-- Neulis (typographer.io): real Neulis Sans (bold copy) + Neulis Cursive
       (the drawn script letters). AFTER the stylesheets on purpose so its
       @font-face wins over the local placeholders; the family names match what
       --font-sans / --font-script already reference, so nothing else changes.
       Poppins still covers the moment before load / if typographer is blocked.
       The beacon is the vendor's usage ping (part of their embed). -->
  <link rel="preconnect" href="https://typographer.io/">
  <link rel="stylesheet" href="https://typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44">
  <script type="module">try{navigator.sendBeacon("https://use.typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44")}catch{}</script>
  <script>document.documentElement.classList.add("js")</script>
</head>

<body data-page="step-6">
  <main class="stage">
    <img class="swirl swirl-back" src="assets/swirl.webp?v=80" alt="" aria-hidden="true">
    <img class="layer layer-hand" src="assets/step6-hand.webp" alt="Gloved hand giving a thumbs up">
    <img class="swirl swirl-front" src="assets/swirl.webp?v=80" alt="" aria-hidden="true">
  </main>

  <!-- Corner bleed (wide frames): a self-clipped window continues the art
       past the frame's bottom-right — see index.html for the full note. -->
  <div class="corner-bleed" aria-hidden="true">
    <img class="cb-swirl" src="assets/swirl.webp?v=80" alt="">
  </div>

  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="./" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
  </header>

  <!-- The end of the flow, so no panel: just the good news and a way onward. -->
  <div class="content content--fill">
    <!-- Same traced ring as step-2.html — see the note there. -->
    <!-- Per the design: ONE mark on this page — a level stroke under "All",
         and "set!" left plain. It used to carry a ring around "All" AND an
         underline under "set", two marks where the design has one. The whole
         line is hand-lettered here (see step-6.css); "All" sits flat, so the
         stroke stays level — same rule as About. -->
    <h1 class="headline anim" style="--d:.1s"><span class="mark underline">All<svg viewBox="0 0 200 22" preserveAspectRatio="none">
          <path class="accent" style="--len:210;stroke-width:4.7" d="M2 9 C 65 7, 135 11, 198 12" />
        </svg></span> set!</h1>

    <!-- No-JS / pre-JS fallback: NEVER claim success here. booking.js swaps
         in the real confirmation (date, time, cadence) from the completed
         flow; if this text is still visible, nothing was verified as booked. -->
    <p class="subhead anim" style="--d:.3s">One moment — we're pulling up your booking details.
      If this line doesn't change, your booking may <strong>not</strong> have gone through:
      check <a class="inkline" href="my-bookings">my bookings</a> or call
      <a class="inkline" href="tel:+18452124444">845-212-4444</a>.</p>

    <div class="actions anim" style="--d:.42s">
      <a class="btn" href="my-bookings">See my bookings</a>
      <a class="btn ghost" href="sign-in">Book another lady</a>
    </div>
  </div>

  <script src="api.js?v=80"></script>
  <script src="app.js?v=80"></script>
  <script src="booking.js?v=80"></script>
</body>

</html>
