<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — Which day works</title>
  <link rel="icon" href="assets/favicon-32.png?v=82" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-16.png?v=82" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=82">
  <link rel="stylesheet" href="dist/styles.css?v=82">
  <link rel="stylesheet" href="css/pages/step-3.css?v=82">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <!-- Neulis (typographer.io): real Neulis Sans (bold copy) + Neulis Cursive
       (the drawn script letters). AFTER the stylesheets on purpose so its
       @font-face wins over the local placeholders; the family names match what
       --font-sans / --font-script already reference, so nothing else changes.
       Poppins still covers the moment before load / if typographer is blocked.
       The beacon is the vendor's usage ping (part of their embed). -->
  <link rel="preconnect" href="https://typographer.io/">
  <link rel="stylesheet" href="https://typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44">
  <script type="module">try{navigator.sendBeacon("https://use.typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44")}catch{}</script>
  <script>document.documentElement.classList.add("js")</script>
</head>

<body data-page="step-3">
  <main class="stage">
    <img class="swirl swirl-back" src="assets/swirl.webp?v=82" alt="" aria-hidden="true">
    <img class="layer layer-hand" src="assets/step3-hand.webp" alt="Gloved hand holding a spray bottle">
    <img class="swirl swirl-front" src="assets/swirl.webp?v=82" alt="" aria-hidden="true">
  </main>

  <!-- Corner bleed (wide frames): a self-clipped window continues the art
       past the frame's bottom-right — see index.html for the full note. -->
  <div class="corner-bleed" aria-hidden="true">
    <img class="cb-swirl" src="assets/swirl.webp?v=82" alt="">
    <img class="cb-hand" src="assets/step3-hand.webp" alt="">
  </div>

  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="./" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
  </header>

  <div class="content content--fill">
    <!-- The cursive letters are the "h" of which and the "r" of works — the
         customer circled exactly those in red in Design/instructions.docx.
         Everything else is Neulis Sans. This is per-letter and not guessable:
         follow the design file, don't infer it from the word.
         "works" sits flat (no descender), so the stroke stays LEVEL — the
         same rule as About / gift / all-set. An arced stroke under straight
         letters reads as a mistake. -->
    <h1 class="headline anim" style="--d:.1s">whic<span class="script">h</span> day <span
        class="mark underline">wo<span class="script">r</span>ks<svg viewBox="0 0 200 22" preserveAspectRatio="none">
          <path class="accent" style="--len:210;stroke-width:4.7" d="M2 9 C 65 7, 135 11, 198 12" />
        </svg></span>?</h1>

    <!-- Styled, not wired: the days are real buttons, but nothing is selected in
         JS yet — one is marked is-on to show the picked state. -->
    <div class="panel anim" style="--d:.28s">
      <!-- The month is real now (booking.js): the label follows the pager, and
           the day grid below is regenerated per month — the markup-shipped July
           is the no-JS fallback and gets replaced on load. -->
      <div class="cal-head">
        <h2>July 2026</h2>
        <div class="cal-nav">
          <button class="choice cal-nav-prev" type="button" aria-label="Previous month">&#8249;</button>
          <button class="choice cal-nav-next" type="button" aria-label="Next month">&#8250;</button>
        </div>
      </div>

      <div class="cal">
        <div class="cal-dow" aria-hidden="true">
          <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
        </div>
        <div class="cal-grid" role="group" aria-label="Choose a day in July 2026">
          <button class="choice" type="button" disabled>29</button>
          <button class="choice" type="button" disabled>30</button>
          <button class="choice" type="button">1</button>
          <button class="choice" type="button">2</button>
          <button class="choice" type="button">3</button>
          <button class="choice" type="button">4</button>
          <button class="choice" type="button">5</button>
          <button class="choice" type="button">6</button>
          <button class="choice" type="button">7</button>
          <button class="choice" type="button">8</button>
          <button class="choice" type="button">9</button>
          <button class="choice" type="button">10</button>
          <button class="choice" type="button">11</button>
          <button class="choice" type="button">12</button>
          <button class="choice" type="button">13</button>
          <button class="choice" type="button">14</button>
          <button class="choice" type="button">15</button>
          <button class="choice" type="button">16</button>
          <button class="choice is-on" type="button" aria-pressed="true">17</button>
          <button class="choice" type="button">18</button>
          <button class="choice" type="button">19</button>
          <button class="choice" type="button">20</button>
          <button class="choice" type="button">21</button>
          <button class="choice" type="button">22</button>
          <button class="choice" type="button">23</button>
          <button class="choice" type="button">24</button>
          <button class="choice" type="button">25</button>
          <button class="choice" type="button">26</button>
          <button class="choice" type="button">27</button>
          <button class="choice" type="button">28</button>
          <button class="choice" type="button">29</button>
          <button class="choice" type="button">30</button>
          <button class="choice" type="button">31</button>
        </div>
      </div>

      <p class="formnote" hidden></p>

      <a class="btn" href="time">Continue</a>
    </div>
  </div>

  <script src="api.js?v=82"></script>
  <script src="app.js?v=82"></script>
  <script src="booking-availability.js?v=82"></script>
  <script src="booking.js?v=82"></script>
</body>

</html>
