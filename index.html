<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — Choose a lady like a lady</title>
  <link rel="icon" href="assets/favicon-32.png?v=81" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-16.png?v=81" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=81">
  <!-- The engine + every shared component. -->
  <link rel="stylesheet" href="dist/styles.css?v=81">
  <!-- This page's dials only. Loaded second so it wins on cascade order. -->
  <link rel="stylesheet" href="css/pages/index.css?v=81">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <!-- Neulis (typographer.io): real Neulis Sans (bold copy) + Neulis Cursive
       (the drawn script letters). AFTER the stylesheets on purpose so its
       @font-face wins over the local placeholders; the family names match what
       --font-sans / --font-script already reference, so nothing else changes.
       Poppins still covers the moment before load / if typographer is blocked.
       The beacon is the vendor's usage ping (part of their embed). -->
  <link rel="preconnect" href="https://typographer.io/">
  <link rel="stylesheet" href="https://typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44">
  <script type="module">try{navigator.sendBeacon("https://use.typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44")}catch{}</script>
  <script>document.documentElement.classList.add("js")</script>
</head>

<!-- data-page drives the dials in css/pages/index.css. It lives on <body>, not
     on .stage, because the chrome below sits OUTSIDE the artwork canvas — a
     custom property set on <main> would never reach it. -->

<body data-page="index">
  <main class="stage">
    <!-- One swirl, drawn twice: the real grainy PSD ribbon (assets/swirl.webp),
       once BEHIND the hand and again IN FRONT (clipped to the glove) at the
       identical position, so a single strand weaves over the wrist. -->
    <img class="layer layer-glow" src="assets/landing-glow.webp" alt="" aria-hidden="true">
    <img class="swirl swirl-back" src="assets/swirl.webp?v=81" alt="" aria-hidden="true">
    <!-- Two hand photos, one motif: hand-landing.webp (arm entering from the
         right) fills the 16:9 crop; the design's own landing-hand.webp (arm
         rising from the ground, the one step-1 shows) takes over once the
         frame is wide enough for the full poster — placed by the wide-mode
         hand dials in src/input.css, which are step-1's PSD-exact values. -->
    <picture>
      <source media="(min-aspect-ratio: 3900/1816)" srcset="assets/landing-hand.webp">
      <img class="layer layer-hand" src="assets/hand-landing.webp" alt="Gloved hand squeezing a soapy sponge">
    </picture>
    <img class="swirl swirl-front" src="assets/swirl.webp?v=81" alt="" aria-hidden="true">
  </main>

  <!-- CORNER BLEED (wide frames only; display:none otherwise). The poster
       cuts band and arm at the canvas edge; on a centred wide frame they
       should keep flowing through the bottom-right corner instead. This is a
       small SELF-CLIPPED window holding duplicates of the two art layers,
       aligned pixel-exactly over the stage's — not un-clipped stage overflow,
       so the page can never grow a scrollbar from off-canvas art, in any
       browser. Geometry in src/input.css's wide-mode block. -->
  <div class="corner-bleed" aria-hidden="true">
    <img class="cb-swirl" src="assets/swirl.webp?v=81" alt="">
    <img class="cb-hand" src="assets/landing-hand.webp" alt="">
  </div>

  <!-- Page chrome — pinned to the VIEWPORT (outside the fill-height artwork canvas)
       so the logo, headline and pill stay put while the artwork bleeds at the edges.
       This lets the artwork anchor right (full glove + wrap-around) without losing
       the copy on tall screens. -->
  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="/" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
    <nav class="utility" aria-label="Account and gifting">
      <a class="ulink anim" style="--d:.1s" href="purchase-a-gift"><span class="inkline">Purchase a gift</span></a>
      <a class="ulink anim" style="--d:.15s" href="my-bookings"><span class="inkline">My bookings</span></a>
    </nav>
  </header>

  <div class="content">
    <a class="eyebrow anim" style="--d:.05s" href="sign-in">Click to hire</a>
    <!-- ONE drawn letter per drawn word (design convention, same as "whic-h" /
         "wo-r-ks"): the "s" of Choose, and the "l" of each "lady" (its looped
         cursive l). Everything else — including "a", "d", "y" — is Neulis Sans,
         so the y has the design's straight sans descender, not a cursive loop. -->
    <h1 class="headline anim" style="--d:.15s">Choo<span class="script drawn-heavy">s</span>e a <span class="mark underline"><span
          class="script">l</span>ady<svg viewBox="0 0 200 34" preserveAspectRatio="none">
          <!-- Traced from the design: a short tip-sag onto a flat crest riding
               under the belly of the "a" (first third of the word), then one
               smooth steady sweep down past the "y" (the design's descent does
               NOT ease out). C1 cubic chain — collinear handles at every joint,
               so no kinks. Squared (butt) ends per the design tips — not round.
               The 200x34 viewBox matches the CSS box aspect (101% word x .4em
               ≈ 5.87:1): the stroke scales uniformly and slopes render as
               drawn. Fitted numerically to the full design PNG's stroke, in the
               GLYPH-INK frame (x normalized by the ink width of "lady", y
               measured from the text baseline) — layout-box normalization was
               ~3%W off because of the cursive l's left bearing. -->
          <path class="accent" style="--len:218;stroke-width:6.9;stroke-linecap:butt" d="M0.9 13.59 C 12.0 13.61, 23.2 12.67, 34.4 12.48 C 53.7 12.16, 73.0 12.07, 92.3 13.51 C 110.3 14.85, 128.2 16.11, 146.2 17.50 C 170.1 19.34, 193.9 20.70, 217.8 22.80" />
        </svg></span><br>like a <span class="script">l</span>ady.</h1>
  </div>

  <!-- Colophon — info + legal, the lowest tier. Mirrors the masthead's insets so
       the page reads as one framed poster: wordmark + utility at the top edge,
       info + legal at the bottom edge, artwork between. -->
  <footer class="botbar">
    <nav class="utility utility--foot" aria-label="Information">
      <a class="ulink anim" style="--d:.3s" href="about"><span class="inkline">About &amp; Contact</span></a>
      <a class="ulink anim" style="--d:.35s" href="terms"><span class="inkline">Terms &amp; Conditions</span></a>
    </nav>
  </footer>

  <script src="api.js?v=81"></script>
  <script src="app.js?v=81"></script>
  <script src="booking.js?v=81"></script>
</body>

</html>
