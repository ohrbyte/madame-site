<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madame — Choose a lady like a lady</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>M</text></svg>">
<link rel="stylesheet" href="dist/styles.css">
</head>
<body>
<main class="stage stage--hero" data-page="index">
  <!-- One swirl, drawn twice: the real grainy PSD ribbon (assets/swirl.webp),
       once BEHIND the hand and again IN FRONT (clipped to the glove) at the
       identical position, so a single strand weaves over the wrist. -->
  <img class="layer layer-glow" src="assets/landing-glow.webp" alt="" aria-hidden="true">
  <img class="swirl swirl-back" src="assets/swirl.webp" alt="" aria-hidden="true">
  <img class="layer layer-hand" src="assets/hand-landing.webp" alt="Gloved hand squeezing a soapy sponge">
  <img class="swirl swirl-front" src="assets/swirl.webp" alt="" aria-hidden="true">

  <a class="logo anim" style="--d:0s" href="index.html" aria-label="Madame home"><img class="logo-mark" src="assets/madame-logo.png" alt="Madame"></a>

  <div class="content" style="--ctop:54.6%;--cw:40%;--cleft:12.3%;">
    <span class="eyebrow anim" style="--d:.05s">Click to hire</span>
    <h1 class="headline anim" style="--d:.15s">Choose a <span class="mark underline"><span class="script">lady</span><svg viewBox="0 0 200 22" preserveAspectRatio="none"><path class="accent" style="--len:240" d="M5 14 C 55 5, 150 5, 196 12"/></svg></span><br>like a <span class="script">lady</span>.</h1>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
