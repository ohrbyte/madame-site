<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — Choose a lady like a lady</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>M</text></svg>">
  <!-- The engine + every shared component. -->
  <link rel="stylesheet" href="dist/styles.css?v=11">
  <!-- This page's dials only. Loaded second so it wins on cascade order. -->
  <link rel="stylesheet" href="css/pages/index.css?v=11">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <script>document.documentElement.classList.add("js")</script>
</head>

<!-- data-page drives the dials in css/pages/index.css. It lives on <body>, not
     on .stage, because the chrome below sits OUTSIDE the artwork canvas — a
     custom property set on <main> would never reach it. -->

<body data-page="index">
  <main class="stage">
    <!-- One swirl, drawn twice: the real grainy PSD ribbon (assets/swirl.webp),
       once BEHIND the hand and again IN FRONT (clipped to the glove) at the
       identical position, so a single strand weaves over the wrist. -->
    <img class="layer layer-glow" src="assets/landing-glow.webp" alt="" aria-hidden="true">
    <img class="swirl swirl-back" src="assets/swirl.webp" alt="" aria-hidden="true">
    <!-- Two hand photos, one motif: hand-landing.webp (arm entering from the
         right) fills the 16:9 crop; the design's own landing-hand.webp (arm
         rising from the ground, the one step-1 shows) takes over once the
         frame is wide enough for the full poster — placed by the wide-mode
         hand dials in src/input.css, which are step-1's PSD-exact values. -->
    <picture>
      <source media="(min-aspect-ratio: 3900/1816)" srcset="assets/landing-hand.webp">
      <img class="layer layer-hand" src="assets/hand-landing.webp" alt="Gloved hand squeezing a soapy sponge">
    </picture>
    <img class="swirl swirl-front" src="assets/swirl.webp" alt="" aria-hidden="true">
  </main>

  <!-- CORNER BLEED (wide frames only; display:none otherwise). The poster
       cuts band and arm at the canvas edge; on a centred wide frame they
       should keep flowing through the bottom-right corner instead. This is a
       small SELF-CLIPPED window holding duplicates of the two art layers,
       aligned pixel-exactly over the stage's — not un-clipped stage overflow,
       so the page can never grow a scrollbar from off-canvas art, in any
       browser. Geometry in src/input.css's wide-mode block. -->
  <div class="corner-bleed" aria-hidden="true">
    <img class="cb-swirl" src="assets/swirl.webp" alt="">
    <img class="cb-hand" src="assets/landing-hand.webp" alt="">
  </div>

  <!-- Page chrome — pinned to the VIEWPORT (outside the fill-height artwork canvas)
       so the logo, headline and pill stay put while the artwork bleeds at the edges.
       This lets the artwork anchor right (full glove + wrap-around) without losing
       the copy on tall screens. -->
  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="/" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
    <nav class="utility" aria-label="Account and gifting">
      <a class="ulink anim" style="--d:.1s" href="purchase-a-gift"><span class="inkline">Purchase a gift</span></a>
      <a class="ulink anim" style="--d:.15s" href="my-bookings"><span class="inkline">My bookings</span></a>
    </nav>
  </header>

  <div class="content">
    <a class="eyebrow anim" style="--d:.05s" href="sign-in">Click to hire</a>
    <h1 class="headline anim" style="--d:.15s">Choose a <span class="mark underline"><span
          class="script">lady</span><svg viewBox="0 0 200 22" preserveAspectRatio="none">
          <!-- Traced from the design (scripts/_fineprof.mjs): dead HORIZONTAL for the
               first 45% (under the "l" and "a"), then a distinct KNEE into a straight
               ~4.5deg descent through the "d" and "y", ending at the y's lowest point.
               A smooth bezier is wrong here — the design's switch-up is sharp. The
               knee is softened only by .accent's stroke-linejoin: round. -->
          <path class="accent" style="--len:210;stroke-width:4.7" d="M2 7 L90 7 L198 19" />
        </svg></span><br>like a <span class="script">lady</span>.</h1>
  </div>

  <!-- Colophon — info + legal, the lowest tier. Mirrors the masthead's insets so
       the page reads as one framed poster: wordmark + utility at the top edge,
       info + legal at the bottom edge, artwork between. -->
  <footer class="botbar">
    <nav class="utility utility--foot" aria-label="Information">
      <a class="ulink anim" style="--d:.3s" href="about"><span class="inkline">About &amp; Contact</span></a>
      <a class="ulink anim" style="--d:.35s" href="terms"><span class="inkline">Terms &amp; Conditions</span></a>
    </nav>
  </footer>

  <script src="api.js?v=11"></script>
  <script src="app.js?v=11"></script>
  <script src="booking.js?v=11"></script>
</body>

</html>
