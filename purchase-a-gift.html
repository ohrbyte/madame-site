<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — Purchase a gift</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>M</text></svg>">
  <link rel="stylesheet" href="dist/styles.css?v=36">
  <link rel="stylesheet" href="css/pages/purchase-a-gift.css?v=36">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <!-- Neulis (typographer.io): real Neulis Sans (bold copy) + Neulis Cursive
       (the drawn script letters). AFTER the stylesheets on purpose so its
       @font-face wins over the local placeholders; the family names match what
       --font-sans / --font-script already reference, so nothing else changes.
       Poppins still covers the moment before load / if typographer is blocked.
       The beacon is the vendor's usage ping (part of their embed). -->
  <link rel="preconnect" href="https://typographer.io/">
  <link rel="stylesheet" href="https://typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44">
  <script type="module">try{navigator.sendBeacon("https://use.typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44")}catch{}</script>
  <script>document.documentElement.classList.add("js")</script>
  <!-- Stripe.js — gift payment. -->
  <script src="https://js.stripe.com/v3/"></script>
  <!-- Cloudflare Turnstile — bot guard on the purchase. Rendered explicitly by
       booking.js, and only when the backend's config carries a site key. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>

<body data-page="purchase-a-gift">
  <!-- Info pages: swirl only. See about.html for why there's no hand, no front
       pass and no glow. -->
  <main class="stage">
    <img class="swirl swirl-back" src="assets/swirl.webp" alt="" aria-hidden="true">
  </main>

  <!-- Corner bleed (wide frames): a self-clipped window continues the art
       past the frame's bottom-right — see index.html for the full note. -->
  <div class="corner-bleed" aria-hidden="true">
    <img class="cb-swirl" src="assets/swirl.webp" alt="">
  </div>

  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="./" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
  </header>

  <div class="content content--fill">
    <!-- The <br> is deliberate: it sets the design's two-line break rather than
         letting the nowrap .mark decide where the line turns. -->
    <!-- Level stroke: this word sits flat (no descender), so the line stays
         level — same rule as About. Words that drop into a descender (the
         landing's "lady", my-bookings' "bookings") keep the downward sweep.
         The full stop sits INSIDE the mark so it can't wrap alone and the
         stroke spans the word + stop, as the design draws it. -->
    <h1 class="headline anim" style="--d:.1s">Give the gift<br>of <span class="mark underline"><span
          class="script">clean</span>.<svg viewBox="0 0 200 22" preserveAspectRatio="none">
          <path class="accent" style="--len:210;stroke-width:4.7" d="M2 9 C 65 7, 135 11, 198 12" />
        </svg></span></h1>

    <!-- Wired (booking.js): the amounts are hours priced at the backend's
         hourly rate (GET /public/giftcards/config — the server enforces the
         real price), the gift rides to the recipient by TEXT so it wants
         phones not emails, and the card well is a Stripe card Element. The
         markup amounts are the no-JS fallback. -->
    <form class="panel anim" style="--d:.3s" action="#">
      <h2>Choose an amount</h2>
      <p>They pick the day. You look thoughtful.</p>

      <!-- Neutral pre-load labels — booking.js (renderAmounts) rebuilds these
           with the real $ price over each hour count once the config loads.
           Shipping £ amounts flashed a British version before the swap; the
           hour counts don't change, so they carry the wait honestly. -->
      <div class="amounts" aria-busy="true">
        <button type="button" class="choice">4 hours</button>
        <button type="button" class="choice is-on">6 hours</button>
        <button type="button" class="choice">10 hours</button>
        <button type="button" class="choice">20 hours</button>
      </div>

      <!-- Wired (booking.js): the "pick your own" stepper, shown when the
           custom cell is chosen. Bounds come from the backend's gift config. -->
      <div class="hours gift-hours" role="group" aria-label="Choose how many hours" hidden>
        <button class="choice hours-step hours-step--minus" type="button" aria-label="One hour less">&minus;</button>
        <span class="hours-value" data-gift-hours>12 hours</span>
        <button class="choice hours-step hours-step--plus" type="button" aria-label="One hour more">+</button>
      </div>

      <div class="fields fields--2">
        <div class="field">
          <label for="gift-to">Who's it for?</label>
          <input id="gift-to" name="gift-to" type="text" placeholder="Their name" autocomplete="name">
        </div>
        <div class="field">
          <label for="gift-phone">Their phone</label>
          <input id="gift-phone" name="gift-phone" type="tel" placeholder="(845) 555-1234" autocomplete="tel">
        </div>
        <div class="field">
          <label for="buyer-name">Your name</label>
          <input id="buyer-name" name="buyer-name" type="text" placeholder="So they know who to thank" autocomplete="name">
        </div>
        <div class="field">
          <label for="buyer-phone">Your phone</label>
          <input id="buyer-phone" name="buyer-phone" type="tel" placeholder="(845) 555-5678" autocomplete="tel">
        </div>
      </div>

      <div class="fields">
        <div class="field">
          <label for="gift-card">Card details</label>
          <div class="stripe-box stripe-box--card" id="gift-card"></div>
        </div>
      </div>

      <!-- Turnstile mounts here when configured; stays hidden (empty) otherwise. -->
      <div class="turnstile-box" id="turnstile" hidden></div>

      <p class="formnote" hidden></p>

      <button class="btn" type="submit">Send the gift</button>

      <!-- Shown only in the done state (see page css) — the stepper and send
           button retire once the gift is out, and this takes their place. -->
      <a class="btn gift-return" href="./">Back to the start</a>
    </form>
  </div>

  <script src="api.js?v=36"></script>
  <script src="app.js?v=36"></script>
  <script src="booking.js?v=36"></script>
</body>

</html>
