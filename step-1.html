<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madame — Ready to roll</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>M</text></svg>">
<link rel="stylesheet" href="dist/styles.css">
</head>
<body>
<main class="stage" style="--hand-l:17.795%;--hand-t:-19.989%;--hand-w:100.000%;--glow-l:69.103%;--glow-t:12.115%;--glow-w:29.026%;" data-page="step-1">
  <img class="layer layer-cream" src="assets/cream.webp" alt="" aria-hidden="true">
  <img class="layer layer-glow" src="assets/landing-glow.webp" alt="" aria-hidden="true">
  <img class="layer layer-swirl" src="assets/swirl.webp" alt="" aria-hidden="true">
  <img class="layer layer-hand"  src="assets/landing-hand.webp" alt="Gloved hand squeezing a soapy sponge">
  <img class="layer layer-swirl-front" src="assets/swirl.webp" alt="" aria-hidden="true">

  <a class="logo anim" style="--d:0s" href="index.html" aria-label="Madame home"><svg class="logo-wave" viewBox="0 0 34 16" aria-hidden="true"><path d="M1 11 C 3 3, 7 3, 9 8 C 11 13, 15 13, 17 8 C 19 3, 23 3, 25 8 C 27 12, 31 11, 33 6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="logo-word">madame</span></a>
  

  <div class="content" style="--ctop:18%;--cw:50%;">

    <h1 class="headline anim" style="--d:.1s">Ready to <span class="mark underline"><span class="script">r</span>oll<svg viewBox="0 0 200 26" preserveAspectRatio="none"><path class="accent" style="--len:240" d="M5 11 C 55 3, 150 3, 196 9"/><path class="accent blue" style="--len:240;--draw-delay:1.55s" d="M6 21 C 60 14, 150 14, 195 18"/></svg></span>?</h1>
    <div class="panel anim" style="--d:.28s">
      <h3>Sign in to get started</h3>
      <p>Create an account or log in to book your first clean.</p>
      <div class="field line">Phone number</div>
      <div style="height:.7rem"></div>
      <a class="btn" style="background:#fff;color:var(--blue)" href="step-2.html">Continue</a>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
