<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — Ready to roll</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>M</text></svg>">
  <link rel="stylesheet" href="dist/styles.css?v=21">
  <link rel="stylesheet" href="css/pages/step-1.css?v=21">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <script>document.documentElement.classList.add("js")</script>
</head>

<body data-page="step-1">
  <!-- No glow: this hand sits further left than the landing's, so the PSD's glow
       blob is no longer hidden behind the sponge and reads as a hard pink halo on
       the right. Steps 2-6 dropped it for the same reason. -->
  <main class="stage">
    <img class="swirl swirl-back" src="assets/swirl.webp" alt="" aria-hidden="true">
    <img class="layer layer-hand" src="assets/landing-hand.webp" alt="Gloved hand squeezing a soapy sponge">
    <img class="swirl swirl-front" src="assets/swirl.webp" alt="" aria-hidden="true">
  </main>

  <!-- Corner bleed (wide frames): a self-clipped window continues the art
       past the frame's bottom-right — see index.html for the full note. -->
  <div class="corner-bleed" aria-hidden="true">
    <img class="cb-swirl" src="assets/swirl.webp" alt="">
    <img class="cb-hand" src="assets/landing-hand.webp" alt="">
  </div>

  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="./" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
  </header>

  <div class="content content--fill">
    <!-- ONE pink stroke, per the design. This used to also draw a blue stroke
         underneath it, which the design doesn't have. -->
    <h1 class="headline anim" style="--d:.1s">Ready to <span class="mark underline"><span
          class="script">r</span>oll<svg viewBox="0 0 200 26" preserveAspectRatio="none">
          <path class="accent" style="--len:240" d="M5 11 C 55 3, 150 3, 196 9" />
        </svg></span>?</h1>

    <!-- Styled, not wired: no link is actually sent. The design shows the
         post-submit confirmation, so it is built here and gated on data-sent —
         flip that attribute to see the sent state.

         The design has no Continue button (you'd really arrive at step 2 from
         the emailed link), which would leave step-2.html unreachable in a
         click-through. So the form GETs its way there: pressing Enter in the
         field walks the flow, with no button and no JS. -->
    <form class="panel panel--center anim" style="--d:.28s" action="address" method="get" data-sent="false">
      <p class="panel-lede">Sign in or create an account to get started.</p>

      <!-- A real toggle with NO JavaScript: two radios drive everything via
           :has() below. Radios (not buttons) because this is one choice out of
           two, which is exactly what a radio group means — so arrow keys, labels
           and screen readers all work for free, and it still works if app.js
           never loads. The radios themselves are hidden; the labels are the UI. -->
      <div class="authswap" role="radiogroup" aria-label="Sign in with">
        <input class="visually-hidden" type="radio" name="mode" id="mode-phone" data-focuses="#signin-phone" checked>
        <label class="authswap-opt" for="mode-phone">Phone</label>
        <input class="visually-hidden" type="radio" name="mode" id="mode-email" data-focuses="#signin-email">
        <label class="authswap-opt" for="mode-email">Email</label>
      </div>

      <!-- Both fields exist and are stacked; the inactive one is visibility:hidden
           so it leaves the tab order rather than lurking in it. Two inputs rather
           than one, because the type is the point: tel gets a phone keypad, email
           gets an email keyboard. That can't be swapped in CSS. -->
      <div class="authfields">
        <label class="visually-hidden" for="signin-phone">Phone number</label>
        <input class="authfield authfield--phone" id="signin-phone" name="phone" type="tel" autocomplete="tel">
        <label class="visually-hidden" for="signin-email">Email address</label>
        <input class="authfield authfield--email" id="signin-email" name="email" type="email" autocomplete="email">
        <!-- The two wired-in stages: the SMS code (after a phone submit) and
             the name (a brand-new client registering). booking.js swaps them
             in with the hidden attribute; each shares the same grid cell so
             the card never jumps. -->
        <label class="visually-hidden" for="signin-code">Verification code</label>
        <input class="authfield authfield--code" id="signin-code" name="code" type="text" inputmode="numeric"
          autocomplete="one-time-code" maxlength="6" hidden>
        <label class="visually-hidden" for="signin-name">Your name</label>
        <input class="authfield authfield--name" id="signin-name" name="name" type="text" autocomplete="name" hidden>
      </div>

      <p class="formnote" hidden></p>

      <p class="authnote">We sent a login link to —<br>Check your inbox and click the link to sign in.</p>
      <a class="authalt" href="#">Use a different email</a>

      <!-- The submit. Hidden until the field holds something sendable (a full
           phone, a real email, the whole code) — then it appears with a label
           that says exactly what pressing it does. It is ALSO the form's
           default button, so Enter submits whether or not it is showing:
           without a submit button a form with several text fields never
           implicitly submits in any browser. booking.js drives label +
           visibility (refreshSubmit). -->
      <button class="btn authsubmit" type="submit" hidden>Continue</button>
    </form>
  </div>

  <script src="api.js?v=21"></script>
  <script src="app.js?v=21"></script>
  <script src="booking.js?v=21"></script>
</body>

</html>
