<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — Ready to book</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>M</text></svg>">
  <link rel="stylesheet" href="dist/styles.css?v=55">
  <link rel="stylesheet" href="css/pages/step-5.css?v=55">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <!-- Neulis (typographer.io): real Neulis Sans (bold copy) + Neulis Cursive
       (the drawn script letters). AFTER the stylesheets on purpose so its
       @font-face wins over the local placeholders; the family names match what
       --font-sans / --font-script already reference, so nothing else changes.
       Poppins still covers the moment before load / if typographer is blocked.
       The beacon is the vendor's usage ping (part of their embed). -->
  <link rel="preconnect" href="https://typographer.io/">
  <link rel="stylesheet" href="https://typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44">
  <script type="module">try{navigator.sendBeacon("https://use.typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44")}catch{}</script>
  <script>document.documentElement.classList.add("js")</script>
  <!-- Stripe.js — the payment step. Loaded in <head> per Stripe's guidance so
       fraud signals cover the whole visit. -->
  <script src="https://js.stripe.com/v3/"></script>
</head>

<body data-page="step-5">
  <main class="stage">
    <img class="swirl swirl-back" src="assets/swirl.webp" alt="" aria-hidden="true">
    <img class="layer layer-hand" src="assets/step5-hand.webp" alt="Gloved hand holding a scrub brush">
    <img class="swirl swirl-front" src="assets/swirl.webp" alt="" aria-hidden="true">
  </main>

  <!-- Corner bleed (wide frames): a self-clipped window continues the art
       past the frame's bottom-right — see index.html for the full note. -->
  <div class="corner-bleed" aria-hidden="true">
    <img class="cb-swirl" src="assets/swirl.webp" alt="">
  </div>

  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="./" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
  </header>

  <div class="content content--fill">
    <h1 class="headline anim" style="--d:.1s">Ready to <span class="mark underline"><span
          class="script">b</span>ook<svg viewBox="0 0 200 26" preserveAspectRatio="none">
          <path class="accent" style="--len:240" d="M5 11 C 55 3, 150 3, 196 9" />
          <path class="accent blue" style="--len:240;--draw-delay:1.55s" d="M6 21 C 60 14, 150 14, 195 18" />
        </svg></span>?</h1>

    <!-- Wired (booking.js): the summary renders the backend's estimate — the
         site never computes money — and the payment rows are the client's
         saved cards plus "add a card", which mounts a Stripe Payment Element
         into the cream well below. The markup rows are the no-JS fallback. -->
    <div class="panel anim" style="--d:.28s">
      <h2>Review &amp; confirm</h2>

      <!-- Neutral loading skeleton — NOT sample data. booking.js replaces the
           whole <dl> once the real estimate returns. It used to ship a London
           address + a £ total, which flashed a "UK version" of the page before
           the real values loaded. Nothing here asserts a place or a currency. -->
      <dl class="review" aria-busy="true">
        <dt>When</dt>
        <dd>Loading your booking…</dd>
        <dt>Where</dt>
        <dd>Your saved address</dd>
        <dt>What</dt>
        <dd>Home clean</dd>
        <dt>Total</dt>
        <dd class="review-total">—</dd>
      </dl>

      <!-- Wired (booking.js): the language was chosen on /time (it filters
           availability there); here it shows in the review rows and rides as
           `language` on create. Notes ride as `notes` — the office sees them
           on the booking's detail page. -->
      <div class="fields">
        <div class="field">
          <label for="booking-notes">Special instructions</label>
          <textarea id="booking-notes" name="booking-notes" rows="2"
            placeholder="Gate code, pets, what to focus on — anything your lady should know."></textarea>
        </div>
      </div>

      <h3 class="pay-title">How would you like to pay?</h3>
      <div class="paylist" role="group" aria-label="Choose a payment method"></div>
      <div class="stripe-box" hidden></div>

      <p class="formnote" hidden></p>

      <a class="btn" href="all-set">Confirm booking</a>
    </div>
  </div>

  <script src="api.js?v=55"></script>
  <script src="app.js?v=55"></script>
  <script src="booking.js?v=55"></script>
</body>

</html>
