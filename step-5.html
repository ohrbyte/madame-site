<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — Ready to book</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>M</text></svg>">
  <link rel="stylesheet" href="dist/styles.css">
  <link rel="stylesheet" href="css/pages/step-5.css">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <script>document.documentElement.classList.add("js")</script>
</head>

<body data-page="step-5">
  <main class="stage">
    <img class="swirl swirl-back" src="assets/swirl.webp" alt="" aria-hidden="true">
    <img class="layer layer-hand" src="assets/step5-hand.webp" alt="Gloved hand holding a scrub brush">
    <img class="swirl swirl-front" src="assets/swirl.webp" alt="" aria-hidden="true">
  </main>

  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="index.html" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
  </header>

  <div class="content content--fill">
    <h1 class="headline anim" style="--d:.1s">Ready to <span class="mark underline"><span
          class="script">b</span>ook<svg viewBox="0 0 200 26" preserveAspectRatio="none">
          <path class="accent" style="--len:240" d="M5 11 C 55 3, 150 3, 196 9" />
          <path class="accent blue" style="--len:240;--draw-delay:1.55s" d="M6 21 C 60 14, 150 14, 195 18" />
        </svg></span>?</h1>

    <!-- Styled, not wired: the summary is static markup standing in for real data. -->
    <div class="panel anim" style="--d:.28s">
      <h2>Review &amp; confirm</h2>

      <dl class="review">
        <dt>When</dt>
        <dd>Friday 17 July, 11:00</dd>
        <dt>Where</dt>
        <dd>14 Ackroyd Road, London</dd>
        <dt>What</dt>
        <dd>Regular clean · 2 bed · ~3 hours</dd>
        <dt>Total</dt>
        <dd class="review-total">£72.00</dd>
      </dl>

      <a class="btn" href="step-6.html">Confirm booking</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
