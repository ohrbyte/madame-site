<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — All set</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>M</text></svg>">
  <link rel="stylesheet" href="dist/styles.css">
  <link rel="stylesheet" href="css/pages/step-6.css">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <script>document.documentElement.classList.add("js")</script>
</head>

<body data-page="step-6">
  <main class="stage">
    <img class="swirl swirl-back" src="assets/swirl.webp" alt="" aria-hidden="true">
    <img class="layer layer-hand" src="assets/step6-hand.webp" alt="Gloved hand giving a thumbs up">
    <img class="swirl swirl-front" src="assets/swirl.webp" alt="" aria-hidden="true">
  </main>

  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="index.html" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
  </header>

  <!-- The end of the flow, so no panel: just the good news and a way onward. -->
  <div class="content content--fill">
    <h1 class="headline anim" style="--d:.1s"><span class="mark circle"><span class="script">A</span>ll<svg
          viewBox="0 0 220 110" preserveAspectRatio="none">
          <path class="accent" style="--len:640"
            d="M158 16 C 70 -2, 14 22, 20 55 C 27 92, 130 100, 188 78 C 224 64, 210 26, 150 14" />
        </svg></span> <span class="mark underline">set<svg viewBox="0 0 200 22" preserveAspectRatio="none">
          <path class="accent" style="--len:240;--draw-delay:1.55s" d="M5 14 C 55 5, 150 5, 196 12" />
        </svg></span>!</h1>

    <p class="subhead anim" style="--d:.3s">Your booking is confirmed. We've sent the details to your
      phone — your cleaner will be there Friday at 11:00.</p>

    <div class="actions anim" style="--d:.42s">
      <a class="btn" href="my-bookings.html">See my bookings</a>
      <a class="btn ghost" href="step-1.html">Book another lady</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
