<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madame — What about the time</title>
  <link rel="icon" href="assets/favicon-32.png?v=71" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-16.png?v=71" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=71">
  <link rel="stylesheet" href="dist/styles.css?v=71">
  <link rel="stylesheet" href="css/pages/step-4.css?v=71">
  <!-- Marks JS as available BEFORE first paint, so the entrance animation
       can hide the copy. Without this the page would render blank if app.js
       ever failed to load. Must stay inline and in <head>. -->
  <!-- Neulis (typographer.io): real Neulis Sans (bold copy) + Neulis Cursive
       (the drawn script letters). AFTER the stylesheets on purpose so its
       @font-face wins over the local placeholders; the family names match what
       --font-sans / --font-script already reference, so nothing else changes.
       Poppins still covers the moment before load / if typographer is blocked.
       The beacon is the vendor's usage ping (part of their embed). -->
  <link rel="preconnect" href="https://typographer.io/">
  <link rel="stylesheet" href="https://typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44">
  <script type="module">try{navigator.sendBeacon("https://use.typographer.io/1/users/02b7d759fbe8d67db08522dd60b7fa571724db3249cfdf2340ad1fee5ef8c97c/9dd83ed47a64af60968c355e57fce691a07632116488f97fde26235f1e27522b/css?token=15142aca44")}catch{}</script>
  <script>document.documentElement.classList.add("js")</script>
</head>

<body data-page="step-4">
  <main class="stage">
    <img class="swirl swirl-back" src="assets/swirl.webp?v=71" alt="" aria-hidden="true">
    <img class="layer layer-hand" src="assets/step4-hand.webp" alt="Gloved hand holding a striped cloth">
    <img class="swirl swirl-front" src="assets/swirl.webp?v=71" alt="" aria-hidden="true">
  </main>

  <!-- Corner bleed (wide frames): a self-clipped window continues the art
       past the frame's bottom-right — see index.html for the full note. -->
  <div class="corner-bleed" aria-hidden="true">
    <img class="cb-swirl" src="assets/swirl.webp?v=71" alt="">
  </div>

  <header class="topbar">
    <a class="logo anim" style="--d:0s" href="./" aria-label="Madame home"><img class="logo-mark"
        src="assets/madame-logo.png" alt="Madame"></a>
  </header>

  <div class="content content--fill">
    <!-- Same traced ring as step-2.html — see the note there. The design draws one
         ring shape for every circled word: its "time" ring measures 248x100
         (aspect 2.48) against step 2's 284x113 (2.51), so this is the same mark
         scaled, not a second drawing. -->
    <h1 class="headline anim" style="--d:.1s">And what about<br>the <span class="mark circle"><span
          class="script">t</span>ime<svg viewBox="0 0 283.4 113.4">
          <path class="accent" style="--len:670"
            d="M280 59 C280 66.5 278.5 75.2 274.7 81.3 C270.9 87.5 263.6 92.3 257 96.1 C250.3 99.8 242.2 101.9 234.7 103.8 C227.1 105.7 219.3 106.8 211.6 107.7 C203.8 108.7 196 109.1 188.2 109.5 C180.4 109.9 172.6 110 164.8 110 C157 110 149.1 109.9 141.3 109.7 C133.5 109.6 125.7 109.5 117.9 109.2 C110.1 108.9 102.2 108.5 94.5 107.9 C86.7 107.3 78.9 106.5 71.2 105.4 C63.5 104.2 55.8 102.9 48.3 100.8 C40.8 98.6 32.9 96.4 26.3 92.6 C19.7 88.7 12.4 84 8.6 77.7 C4.8 71.5 3.4 62.6 3.4 55.1 C3.4 47.7 4.9 39 8.8 32.8 C12.7 26.6 20 21.8 26.7 18.1 C33.3 14.3 41.3 12.2 48.8 10.2 C56.3 8.2 64.1 7.1 71.8 6 C79.6 5 87.4 4.5 95.2 4 C103 3.6 110.8 3.5 118.6 3.4 C126.5 3.3 134.3 3.5 142.1 3.6 C149.9 3.8 157.7 3.9 165.5 4.2 C173.3 4.5 181 4.9 188.8 5.6 C196.6 6.3 204.5 7.1 212.2 8.4 C219.9 9.7 227.6 11 235 13.2 C242.5 15.4 250.2 17.7 256.9 21.6 C263.5 25.5 270.8 30.2 274.6 36.4 C278.5 42.7 280 51.5 280 59 Z" />
        </svg></span>?</h1>

    <!-- Styled, not wired: real buttons, one marked is-on to show the picked state. -->
    <div class="panel anim" style="--d:.28s">
      <!-- Wired (booking.js): the heading is the day picked on step 3, the
           stepper sets how long the clean runs (bounds from /bookings/rules),
           and the grid below is the API's real availability for that day and
           duration. The markup-shipped times are the no-JS fallback. -->
      <h2>Friday 17 July</h2>

      <p>How often should we come?</p>
      <div class="freq" role="group" aria-label="How often">
        <button class="choice is-on" type="button" aria-pressed="true">Just once</button>
        <button class="choice" type="button">Every week</button>
        <button class="choice" type="button">Every 2 weeks</button>
        <button class="choice" type="button">Every 4 weeks</button>
      </div>

      <!-- Wired (booking.js): the client's past cleaners, pick-one. Hidden
           entirely for clients with no completed cleans. -->
      <p class="ladypick-line" hidden>Want a lady you've had before?</p>
      <div class="ladypick" role="group" aria-label="Preferred cleaner" hidden></div>

      <!-- Wired (booking.js): the language filters WHO counts as available —
           it lives here, with the other availability inputs, so a Georgian
           speaker never picks a slot only an English-only cleaner can take
           (that used to surface as a failure AFTER card entry). Rides the
           flow state to /review and onto create. -->
      <div class="fields">
        <div class="field">
          <label for="booking-language">Your lady speaks</label>
          <!-- Options come from the office's Settings list (booking.js fills
               them from /public/bookings/rules), so adding a language in the
               dashboard offers it here with no site change. The options below
               are the markup-shipped fallback — same pattern as the time grid
               and gift amounts — used only before/without JS, or if the API
               doesn't report a list. JS always replaces them. -->
          <select id="booking-language" name="booking-language">
            <option value="English" selected>English</option>
            <option value="Spanish">Spanish</option>
            <option value="Georgian">Georgian</option>
            <option value="Polish">Polish</option>
            <option value="Ukrainian">Ukrainian</option>
          </select>
        </div>
      </div>

      <p data-hours-line>How many hours do you need?</p>

      <div class="hours" role="group" aria-label="Choose how many hours">
        <button class="choice hours-step hours-step--minus" type="button" aria-label="One hour less">&minus;</button>
        <span class="hours-value" data-hours-value>3 hours</span>
        <button class="choice hours-step hours-step--plus" type="button" aria-label="One hour more">+</button>
      </div>

      <div class="timegrid" role="group" aria-label="Choose a start time">
        <button class="choice" type="button" disabled>08:00</button>
        <button class="choice" type="button">09:00</button>
        <button class="choice" type="button">10:00</button>
        <button class="choice is-on" type="button" aria-pressed="true">11:00</button>
        <button class="choice" type="button">12:00</button>
        <button class="choice" type="button">13:00</button>
        <button class="choice" type="button">14:00</button>
        <button class="choice" type="button">15:00</button>
        <button class="choice" type="button" disabled>16:00</button>
      </div>

      <p class="formnote" hidden></p>

      <a class="btn" href="review">Continue</a>
    </div>
  </div>

  <script src="api.js?v=71"></script>
  <script src="app.js?v=71"></script>
  <script src="booking.js?v=71"></script>
</body>

</html>
